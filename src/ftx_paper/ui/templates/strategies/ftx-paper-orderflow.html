<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orderflow Strategy · Replay</title>
  <style>
    :root { font: 15px "Segoe UI", system-ui, sans-serif; color: #24211d; background: #faf8f4; --muted: #746d64; --line: #ded7cc; --panel: #fffdf9; --accent: #a35428; --soft: #f6e3d5; }
    * { box-sizing: border-box; } body { margin: 0; } header { padding: 24px max(22px, calc((100% - 1180px) / 2)); background: #38251c; color: #fff8f0; } header h1 { margin: 0; font-size: 25px; } header p { margin: 5px 0 0; color: #e8c9b4; }
    main { max-width: 1180px; margin: auto; padding: 24px 22px 48px; } nav { display: flex; gap: 2px; flex-wrap: wrap; margin-bottom: 20px; } nav a { color: var(--muted); text-decoration: none; padding: 8px 10px; border-radius: 20px; min-height: 40px; font-weight: 600; } nav a.active, nav a:hover { background: var(--soft); color: #7b3f20; }
    .bar, .filters { display: flex; justify-content: space-between; gap: 12px; align-items: end; flex-wrap: wrap; } .eyebrow { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; } select, input, button { min-height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 8px 11px; font: inherit; } button { background: var(--accent); color: #fff; cursor: pointer; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; } h2 { margin: 0 0 12px; font-size: 19px; } .outcome { display: grid; grid-template-columns: 1.3fr repeat(4, 1fr); gap: 10px; margin: 16px 0; } .outcome > div { padding: 15px; border-radius: 10px; background: #f5efe8; } .outcome .lead { background: var(--soft); } .lead h2 { margin: 5px 0; font-size: 27px; } .muted { color: var(--muted); } .value { display: block; margin-top: 7px; font-size: 24px; font-weight: 700; }
    .run { display: grid; grid-template-columns: 160px 120px 1fr auto; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); } .badge { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #eee8df; font-size: 12px; font-weight: 700; } .good { background: #d9f0d4; color: #2e6b2c; } .warn { background: #fff0c9; color: #805c00; } .empty { padding: 32px; text-align: center; color: var(--muted); }
    .table-wrap { overflow-x: auto; } table { width: 100%; border-collapse: collapse; white-space: nowrap; } th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); } th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; } td.num, th.num { text-align: right; } .positive { color: #2e6b2c; } .negative { color: #9b3328; } code { font-size: 12px; }
    @media (max-width: 760px) { .outcome { grid-template-columns: repeat(2, 1fr); } .outcome .lead { grid-column: 1 / -1; } .run { grid-template-columns: 1fr 1fr; } .run span { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <header><div><h1>FTX Paper Trading</h1><p>Operator control center · ftx-paper-orderflow</p></div></header>
  <main><nav>{% for item in [('dashboard', 'Dashboard'), ('decisions', 'Decisions'), ('positions', 'Positions'), ('trades', 'Trades'), ('capital', 'Capital'), ('replay', 'Replay'), ('activity', 'Activity')] %}<a class="{% if page == item[0] %}active{% endif %}" href="/{% if item[0] != 'dashboard' %}{{ item[0] }}{% endif %}{% if item[0] != 'dashboard' %}?strategy_id=ftx-paper-orderflow{% endif %}">{{ item[1] }}</a>{% endfor %}</nav><div id="app"><div class="card empty">Loading…</div></div></main>
  <script id="config" type="application/json">{{ {'api': api_base_url, 'page': page, 'strategy_id': strategy_id}|tojson }}</script>
  <script>
    const cfg = JSON.parse(document.getElementById('config').textContent); const api = cfg.api; const strategy = cfg.strategy_id;
    const esc = (v) => String(v ?? '—').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const val = (v, digits = 1) => v === null || v === undefined || v === '' ? '—' : (typeof v === 'number' ? v.toFixed(digits).replace(/\.0$/, '') : esc(v));
    const tone = (v) => Number(v) < 0 ? 'negative' : Number(v) > 0 ? 'positive' : '';
    async function get(path, options) { const r = await fetch(api + path, options); const body = await r.json(); if (!r.ok) throw Error(body.error?.message || 'Request failed'); return body; }
    function table(title, headers, rows, empty = 'No records.') { return `<div class="card"><h2>${title}</h2>${rows.length ? `<div class="table-wrap"><table><thead><tr>${headers.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((cell, i) => `<td class="${i > 0 && typeof cell === 'number' ? `num ${tone(cell)}` : ''}">${typeof cell === 'string' && cell.length > 42 ? `<code>${esc(cell)}</code>` : val(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : `<div class="empty">${empty}</div>`}</div>`; }
    function reportView(run) {
      const report = run?.result?.report || {}; const extension = report.extensions?.[report.strategy_id] || {}; const summary = report.summary || {}; const locations = extension.location_attribution || {};
      const locationRows = Object.entries(locations).map(([location, item]) => [location, item.trades ?? item.trade_count ?? 0, item.wins ?? item.winning_trade_count ?? 0, item.losses ?? item.losing_trade_count ?? 0, item.reward ?? item.total_reward_points ?? 0, Object.entries(item.exit_reasons || {}).map(([k, v]) => `${k}: ${v}`).join(', ')]);
      const tradeRows = (extension.trades || []).map((trade) => [trade.date || report.session_date, trade.location || trade.canonical_location || 'UNKNOWN', String(trade.side || trade.direction || '').toUpperCase(), trade.setup || trade.position_id, trade.entry || trade.entry_time, trade.entry_price, trade.effective_lots ?? trade.quantity ?? 1, trade.exit || trade.exit_time, trade.exit_price, trade.reward ?? trade.reward_points ?? trade.gross_pnl_rs, trade.risk_reward ?? trade.rr, trade.reason || trade.exit_reason || 'open']);
      const artifacts = Object.entries(report.artifacts || {}).map(([name, path]) => [name, path]);
      const sourceIdentity = extension.metadata?.input_provenance?.current?.storage_identity || {};
      const source = summary.source || (sourceIdentity.symbol && sourceIdentity.expiry ? `${sourceIdentity.symbol} FUT ${sourceIdentity.expiry}` : 'UNAVAILABLE');
      return `<div class="eyebrow">Causal state-machine replay</div><h2>${esc(report.session_date || run?.request?.session_date || 'Replay')}</h2><div class="outcome"><div class="lead"><div class="eyebrow">${esc(strategy)}</div><h2>${esc(run?.status || 'Replay')}</h2><span class="muted">Runner-owned structured report</span></div><div><div class="eyebrow">Setup candidates</div><span class="value">${val(summary.setup_candidates ?? summary.candidates)}</span></div><div><div class="eyebrow">Entries filled</div><span class="value">${val(summary.entries_filled ?? summary.orders_filled)}</span></div><div><div class="eyebrow">Trades</div><span class="value">${val(summary.trades ?? summary.closed_trades ?? tradeRows.length)}</span></div><div><div class="eyebrow">Gross points</div><span class="value ${tone(summary.gross_points ?? summary.gross_pnl)}">${val(summary.gross_points ?? summary.gross_pnl)}</span></div></div>${table('Summary', ['Date', 'Status', 'Source', 'Sessions', 'Setup candidates', 'Entries filled', 'Trades', 'Location interactions', 'Achieved R:R', 'Gross points'], [[report.session_date, run?.status || '—', source, summary.sessions || '1/1 replayed', summary.setup_candidates ?? summary.candidates ?? 0, summary.entries_filled ?? summary.orders_filled ?? 0, summary.trades ?? summary.closed_trades ?? tradeRows.length, summary.location_interactions ?? summary.interactions ?? 0, summary.achieved_rr ?? summary.risk_reward, summary.gross_points ?? summary.gross_pnl]])}${table('Location attribution', ['Location', 'Trades', 'Wins', 'Losses', 'Reward', 'Exits'], locationRows)}${table('Trades', ['Date', 'Location', 'Side', 'Setup', 'Entry', 'Entry Px', 'Effective lots', 'Exit', 'Exit Px', 'Reward', 'R:R', 'Reason'], tradeRows)}${table('Artifacts', ['Artifact', 'Path'], artifacts)}`;
    }
    function history(data) { const runs = data.runs || []; return `<div class="bar"><div><div class="eyebrow">Orderflow replay</div><h2>Historical runs</h2></div><div class="filters"><label>Session date<input id="date" type="date"></label><button id="queue">Queue replay</button></div></div><div class="card"><h2>Replay history</h2>${runs.length ? runs.map((r) => `<div class="run"><strong>${esc(r.request?.session_date || 'Unknown date')}</strong><span class="badge ${r.status === 'completed' ? 'good' : 'warn'}">${esc(r.status)}</span><span class="muted"><code>${esc(r.run_id)}</code></span><button data-run="${esc(r.run_id)}">View report</button></div>`).join('') : '<div class="empty">No replay runs yet.</div>'}</div><div id="report"></div>`; }
    async function load() { try { const data = await get(`/api/v1/strategies/${encodeURIComponent(strategy)}/replays`); document.getElementById('app').innerHTML = history(data); document.querySelectorAll('[data-run]').forEach((button) => button.addEventListener('click', () => show(button.dataset.run))); document.getElementById('queue')?.addEventListener('click', async () => { const session_date = document.getElementById('date').value; if (!session_date) return; await get(`/api/v1/strategies/${encodeURIComponent(strategy)}/replays`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({session_date, vehicles:['futures','synthetic'], mode:'replay', include_parity_layers:false})}); load(); }); const latest = data.runs?.find((r) => r.status === 'completed'); if (latest) show(latest.run_id); } catch (e) { document.getElementById('app').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; } }
    async function show(runId) { const report = document.getElementById('report'); report.innerHTML = '<div class="card empty">Loading report…</div>'; try { report.innerHTML = reportView(await get(`/api/v1/strategies/${encodeURIComponent(strategy)}/replays/${encodeURIComponent(runId)}`)); } catch (e) { report.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; } }
    load();
  </script>
</body>
</html>
