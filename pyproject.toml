[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftx-paper"
version = "0.1.0"
description = "Standalone FTX live paper-trading runtime and operator API"
requires-python = ">=3.12"
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
zerodha = ["kiteconnect>=5", "websockets>=13"]

[project.scripts]
ftx-paper-api = "ftx_paper.cli:api_main"
ftx-web = "ftx_paper.cli:api_main"
ftx-paper-ui = "ftx_paper.cli:ui_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
